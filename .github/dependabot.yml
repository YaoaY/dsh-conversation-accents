version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: typescript
        versions: [">=6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
